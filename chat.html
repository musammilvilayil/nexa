<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eef2ff;font:15px system-ui}.app{height:100vh;display:grid;grid-template-columns:250px 1fr}.side{border-right:1px solid #242936;padding:22px;background:#0e1118}.brand{font-size:22px;font-weight:800;letter-spacing:4px}.muted{color:#8d96aa;font-size:12px}.new{width:100%;margin:25px 0;padding:12px;border:1px solid #303748;background:#171b25;color:white;border-radius:12px}.main{display:flex;flex-direction:column;max-width:1000px;width:100%;margin:auto;height:100vh}.top{padding:20px;border-bottom:1px solid #202532}.messages{flex:1;overflow:auto;padding:30px}.msg{max-width:760px;padding:14px 17px;margin:12px 0;border-radius:16px;line-height:1.5;white-space:pre-wrap}.user{margin-left:auto;background:#252b38}.ai{background:#141923;border:1px solid #252c3a}.composer{padding:20px}.box{display:flex;gap:10px;border:1px solid #303748;background:#151923;border-radius:18px;padding:10px}.box textarea{flex:1;resize:none;background:none;border:0;outline:0;color:white;padding:8px;font:inherit}.send{border:0;border-radius:12px;padding:0 20px;font-weight:700}.status{font-size:12px;color:#7f8aa1;margin-top:8px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}}</style></head><body><div class="app"><aside class="side"><div class="brand">NEXA</div><div class="muted">Agent Platform v2</div><button class="new" onclick="newChat()">+ New chat</button><div class="muted">Workspace<br>Tools · Files · CLI · Agents</div></aside><main class="main"><div class="top"><b>NEXA</b> <span class="muted">autonomous workspace</span></div><div id="messages" class="messages"><div class="msg ai">Hi. I'm NEXA. Ask me to work with your workspace, tools or files.</div></div><div class="composer"><div class="box"><textarea id="input" rows="2" placeholder="Message NEXA..."></textarea><button class="send" onclick="send()">Send</button></div><div id="status" class="status">Ready</div></div></main></div><script>let session=localStorage.nexaSession||null;const msgs=document.getElementById('messages'),input=document.getElementById('input'),statusEl=document.getElementById('status');function bubble(text,kind){let d=document.createElement('div');d.className='msg '+kind;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}function newChat(){session=null;localStorage.removeItem('nexaSession');msgs.innerHTML='<div class="msg ai">New session ready. What should we build?</div>'}async function send(){let text=input.value.trim();if(!text)return;input.value='';bubble(text,'user');statusEl.textContent='NEXA is working…';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:session})});let data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');session=data.session_id;localStorage.nexaSession=session;bubble(data.message,'ai');statusEl.textContent=data.tool_calls?.length?`Completed ${data.tool_calls.length} tool action(s)`:'Ready'}catch(e){bubble('Error: '+e.message,'ai');statusEl.textContent='Failed'}}input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})</script></body></html>
