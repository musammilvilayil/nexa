name: NEXA Tests

on:
  push:
    branches:
      - main
      - kernel-v0.1
      - trading-core-v0.1
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unittest regression suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Pytest collection guard
        shell: pwsh
        run: python -m pytest -q
